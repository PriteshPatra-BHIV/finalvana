<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #0b0f19;
            color: #fff;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr;
            margin-top: 20px;
        }

        .card {
            background: #151a28;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2a3441;
        }

        textarea.input-box {
            width: 100%;
            height: 180px;
            background: #0f131a;
            color: #a5d6ff;
            padding: 15px;
            border: 1px solid #30363d;
            font-family: monospace;
            font-size: 14px;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #2ea043;
        }

        pre#output {
            background: #0f131a;
            padding: 20px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 14px;
            color: #7ee787;
            border: 1px solid #30363d;
            min-height: 300px;
            margin-top: 10px;
        }

        h3 {
            margin-top: 0;
            font-size: 16px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Group 2 Runtime — Verification Terminal</h2>
        <p style="color:#8b949e">Live E2E Verification Target: <code
                style="color:#7ee787; background: #0f131a; padding: 2px 6px; border-radius: 4px;">POST https://niyantran.blackholeinfiverse.com/api/group2/context/resolve</code>
        </p>

        <div class="grid">
            <div class="card">
                <h3>1. Input Request Payload (Group 1 Data)</h3>
                <textarea id="payloadInput" class="input-box">{
  "observationId": "TC-Z03-EXT-OPENMETEO-OBS001",
  "location": "19.1288, 72.9421",
  "timestamp": "2026-08-27T11:00:00Z",
  "parameters": {
     "temperature": 28.4
  }
}</textarea>
            </div>

            <button id="runBtn" onclick="runTest()">▶ Execute Group 2 Decision Engine</button>

            <div class="card">
                <h3>2. Runtime Ruling Output (Provenance Artifact)</h3>
                <pre id="output">Waiting for execution command...</pre>
            </div>
        </div>
    </div>
    <script>
        async function runTest() {
            const out = document.getElementById('output');
            const btn = document.getElementById('runBtn');
            const inputVal = document.getElementById('payloadInput').value;

            out.textContent = "Executing POST request to Live Endpoint...\nEvaluating Context Ruling...";
            out.style.color = "#d2a8ff";
            btn.textContent = "⚙ Executing...";
            btn.style.background = "#8957e5";

            try {
                let parsedBody;
                try {
                    parsedBody = JSON.parse(inputVal);
                } catch (e) {
                    throw new Error("Invalid JSON formatting in the request payload.");
                }

                // Local route bypasses browser CORS locks for test files
                const payloadObj = JSON.parse(document.getElementById('payloadInput').value);
                payloadObj.simulate_g1_response = { canonical_record_id: "CR-b4615a27-7ab1-4bde-a078-a56fa0f2414c", observation_timestamp: null };
                const response = await fetch('http://localhost:8002/api/group2/context/resolve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadObj)
                });

                const data = await response.json();
                out.style.color = "#7ee787";
                out.textContent = "=== RUNTIME RULING ARTIFACT RECEIVED ===\n\n" + JSON.stringify(data, null, 2);
            } catch (error) {
                out.style.color = "#ff7b72";
                out.textContent = "Error: " + error.message;
            } finally {
                btn.textContent = "▶ Execute Group 2 Decision Engine";
                btn.style.background = "#238636";
            }
        }
    </script>
</body>

</html>

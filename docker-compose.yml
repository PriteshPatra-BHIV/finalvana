# ==============================================================================
# VANA Platform — Full-Stack VM Docker Compose (Reference Stack for DevOps)
# ==============================================================================
# Usage on VM:
#   cp .env.example .env      # Fill in production passwords & domain
#   docker compose up -d --build
#
# Services:
#   - vana-db        : PostgreSQL 16 + PostGIS 3.4 (internal network only)
#   - vana-masterdb  : Group 1 MasterDB API (bound to VM loopback :8013)
#   - vana-auth      : Unified Auth & Group 4 Runtime (bound to VM loopback :8010)
#   - vana-frontend  : Static Control Center UI + Nginx /proxy/* gateway (:8080)
#
# DevOps Note: Terminate HTTPS/TLS in front of vana-frontend (e.g. host Nginx,
# Caddy, or cloud load balancer forwarding to 127.0.0.1:${VANA_FRONTEND_PORT}).
# ==============================================================================

services:
  vana-db:
    image: postgis/postgis:16-3.4
    container_name: vana_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vana_masterdb}
    volumes:
      - vana_pg_data:/var/lib/postgresql/data
    networks:
      - vana_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vana} -d ${POSTGRES_DB:-vana_masterdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  vana-masterdb:
    build:
      context: ./backend/group1-masterdb
      dockerfile: Dockerfile
    container_name: vana_masterdb
    env_file:
      - .env
    depends_on:
      vana-db:
        condition: service_healthy
    environment:
      VANA_DATABASE_URL: ${VANA_DATABASE_URL:-postgresql://${POSTGRES_USER:-vana}:${POSTGRES_PASSWORD}@vana-db:5432/${POSTGRES_DB:-vana_masterdb}}
      VANA_CORS_ORIGINS: ${VANA_CORS_ORIGINS:-http://localhost:8080}
      PORT: "8000"
    ports:
      - "127.0.0.1:${VANA_G1_PORT:-8013}:8000"
    networks:
      - vana_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  vana-auth:
    build:
      context: .
      dockerfile: backend/Dockerfile.auth
    container_name: vana_auth
    env_file:
      - .env
    depends_on:
      vana-db:
        condition: service_healthy
    environment:
      VANA_ENV: ${VANA_ENV:-production}
      VANA_DATABASE_URL: ${VANA_DATABASE_URL:-postgresql://${POSTGRES_USER:-vana}:${POSTGRES_PASSWORD}@vana-db:5432/${POSTGRES_DB:-vana_masterdb}}
      VANA_CORS_ORIGINS: ${VANA_CORS_ORIGINS:-http://localhost:8080}
      PORT: "8000"
    ports:
      - "127.0.0.1:${VANA_AUTH_PORT:-8010}:8000"
    networks:
      - vana_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  vana-frontend:
    build:
      context: ./frontend/group5-lineage-dashboard/vana-control-center
      dockerfile: Dockerfile
    container_name: vana_frontend
    env_file:
      - .env
    depends_on:
      vana-masterdb:
        condition: service_healthy
      vana-auth:
        condition: service_healthy
    environment:
      VANA_BACKEND_URL: ${VANA_BACKEND_URL:-http://vana-auth:8000}
      VANA_G1_URL: ${VANA_G1_URL:-http://vana-masterdb:8000}
      VANA_G2_URL: ${VANA_G2_URL:-https://niyantran.blackholeinfiverse.com}
      VANA_G4_URL: ${VANA_G4_URL:-http://vana-auth:8000}
    ports:
      - "${VANA_FRONTEND_PORT:-8080}:80"
    networks:
      - vana_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  vana_network:
    driver: bridge

volumes:
  vana_pg_data:
    driver: local
